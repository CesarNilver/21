<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas Para Ti 🌻✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05040a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Georgia', serif;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .mensaje-centro {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            color: #ffffff;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px #ffea00, 0 0 20px #ffae00;
            pointer-events: none;
            text-align: center;
        }

        .etiqueta-flotante {
            position: absolute;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: bold;
            text-shadow: 0 0 5px #000, 0 0 10px #ffea00;
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            animation: flotar 3s ease-in-out infinite alternate;
        }

        @keyframes flotar {
            0% { transform: translate(-50%, -50%) translateY(0px); }
            100% { transform: translate(-50%, -50%) translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="mensaje-centro">Te amo 💛</div>
    <canvas id="canvasGalaxia"></canvas>

    <script>
        const canvas = document.getElementById("canvasGalaxia");
        const ctx = canvas.getContext("2d");

        let ancho = canvas.width = window.innerWidth;
        let alto = canvas.height = window.innerHeight;

        window.addEventListener("resize", () => {
            ancho = canvas.width = window.innerWidth;
            alto = canvas.height = window.innerHeight;
            crearCorazon();
        });

        // 1. Estrellas de fondo
        const estrellas = Array.from({ length: 300 }, () => ({
            x: Math.random() * ancho,
            y: Math.random() * alto,
            radio: Math.random() * 1.5,
            alpha: Math.random(),
            vAlpha: (Math.random() - 0.5) * 0.02
        }));

        // 2. Corazón de Polvo Dorado
        let particulasCorazon = [];
        function crearCorazon() {
            particulasCorazon = [];
            const centroX = ancho / 2;
            const centroY = alto * 0.32;
            const escala = Math.min(ancho, alto) / 55;

            for (let i = 0; i < 450; i++) {
                const t = Math.random() * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                particulasCorazon.push({
                    x: centroX + x * escala + (Math.random() - 0.5) * 12,
                    y: centroY + y * escala + (Math.random() - 0.5) * 12,
                    radio: Math.random() * 2 + 0.5,
                    alpha: Math.random() * 0.8 + 0.2
                });
            }
        }
        crearCorazon();

        // 3. Galaxia Espiral Central
        const particulasGalaxia = Array.from({ length: 600 }, () => {
            const angulo = Math.random() * Math.PI * 6;
            const dist = 6 * angulo + (Math.random() - 0.5) * 20;
            return {
                angulo: angulo,
                distancia: dist,
                radio: Math.random() * 2 + 1,
                color: ["#ffea00", "#ffd700", "#ffffff", "#ffae00"][Math.floor(Math.random() * 4)]
            };
        });

        // 4. Dibujar Flores y Ramos
        function dibujarFlor(cx, cy, tam, petalos = 10) {
            ctx.save();
            ctx.translate(cx, cy);

            // Pétalos
            ctx.fillStyle = "#ffea00";
            for (let i = 0; i < petalos; i++) {
                const ang = (i * Math.PI * 2) / petalos;
                ctx.beginPath();
                ctx.rotate(ang);
                ctx.ellipse(tam * 1.2, 0, tam * 1.1, tam * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.rotate(-ang);
            }

            // Centro
            ctx.fillStyle = "#5c3d11";
            ctx.beginPath();
            ctx.arc(0, 0, tam * 0.7, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function dibujarRamo(x, y, escala) {
            ctx.save();
            ctx.translate(x, y);

            // Papel de envoltura
            ctx.fillStyle = "#e0c097";
            ctx.beginPath();
            ctx.moveTo(0, 45 * escala);
            ctx.lineTo(-25 * escala, 10 * escala);
            ctx.lineTo(25 * escala, 10 * escala);
            ctx.closePath();
            ctx.fill();

            // Cinta rosa
            ctx.fillStyle = "#f48fb1";
            ctx.fillRect(-10 * escala, 20 * escala, 20 * escala, 8 * escala);

            // Hojas
            ctx.fillStyle = "#4caf50";
            ctx.beginPath();
            ctx.arc(-15 * escala, -5 * escala, 10 * escala, 0, Math.PI * 2);
            ctx.arc(15 * escala, -5 * escala, 10 * escala, 0, Math.PI * 2);
            ctx.fill();

            // Flores arriba
            dibujarFlor(-12 * escala, -12 * escala, 12 * escala);
            dibujarFlor(12 * escala, -12 * escala, 12 * escala);
            dibujarFlor(0, -22 * escala, 14 * escala);

            ctx.restore();
        }

        // Elementos interactivos
        const frases = [
            { texto: "Te adoro 💛", x: 0.22, y: 0.32, tipo: "ramo", esc: 1.1 },
            { texto: "Te Amo ✨", x: 0.78, y: 0.32, tipo: "ramo", esc: 1.1 },
            { texto: "Eres mi sol 🌻", x: 0.15, y: 0.55, tipo: "ramo", esc: 1.0 },
            { texto: "Eres mi todo 💖", x: 0.85, y: 0.55, tipo: "ramo", esc: 1.0 },
            { texto: "Siempre juntos 💛", x: 0.50, y: 0.78, tipo: "ramo", esc: 1.2 },
            { texto: "Amor de mi vida", x: 0.35, y: 0.42, tipo: "flor", esc: 10 },
            { texto: "Eres preciosa", x: 0.65, y: 0.42, tipo: "flor", esc: 10 },
            { texto: "Eres única 🌟", x: 0.30, y: 0.68, tipo: "flor", esc: 10 }
        ];

        // Crear etiquetas en el DOM
        frases.forEach(item => {
            if(item.texto) {
                const el = document.createElement("div");
                el.className = "etiqueta-flotante";
                el.innerText = item.texto;
                el.style.left = `${item.x * 100}%`;
                el.style.top = `${(item.y + 0.06) * 100}%`;
                document.body.appendChild(el);
            }
        });

        // Bucle de Animación
        let rotacionGalaxia = 0;
        function animar() {
            ctx.fillStyle = "rgba(5, 4, 10, 0.3)";
            ctx.fillRect(0, 0, ancho, alto);

            // A. Estrellas
            estrellas.forEach(e => {
                e.alpha += e.vAlpha;
                if (e.alpha <= 0.1 || e.alpha >= 1) e.vAlpha *= -1;
                ctx.fillStyle = `rgba(255, 255, 255, ${e.alpha})`;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radio, 0, Math.PI * 2);
                ctx.fill();
            });

            // B. Corazón Dorado
            particulasCorazon.forEach(p => {
                ctx.fillStyle = `rgba(255, 235, 59, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x + (Math.random() - 0.5) * 2, p.y + (Math.random() - 0.5) * 2, p.radio, 0, Math.PI * 2);
                ctx.fill();
            });

            // C. Espiral Galáctico (Centro)
            rotacionGalaxia += 0.008;
            const gx = ancho / 2;
            const gy = alto * 0.55;

            particulasGalaxia.forEach(p => {
                const ang = p.angulo + rotacionGalaxia;
                const px = gx + Math.cos(ang) * p.distancia * 1.8;
                const py = gy + Math.sin(ang) * (p.distancia * 0.6);

                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(px, py, p.radio, 0, Math.PI * 2);
                ctx.fill();
            });

            // D. Ramos y Flores
            frases.forEach(item => {
                const posX = item.x * ancho;
                const posY = item.y * alto;

                if (item.tipo === "ramo") {
                    dibujarRamo(posX, posY, item.esc);
                } else {
                    dibujarFlor(posX, posY, item.esc);
                }
            });

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
